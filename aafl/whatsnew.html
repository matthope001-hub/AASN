<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../shared/gate.js" data-gate="aafl"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New — AAFL 2026</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07101F">
<link rel="icon" type="image/png" href="assets/icon-180.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Saira+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aafl.css?v=5">
<script src="../shared/switcher.js" data-pool="aafl" defer></script>
<style>
.pg{padding-top:20px;padding-bottom:28px}
.pg h1{font-family:var(--display);font-weight:400;font-size:32px;margin:0}
.lead{color:var(--mut);margin:2px 0 16px}
.log{display:grid;gap:12px;max-width:820px}
.log article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.log h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0}
.log time{display:block;color:var(--mut);font-size:13px;margin:2px 0 6px}
.log ul{margin:0;padding-left:20px;color:#C9D3E0;font-size:16px;line-height:1.5}
</style>
</head>
<body>
<header class="hdr">
  <div class="wrap hdr-in">
    <a href="./" class="brand" aria-label="AAFL home">
      <img src="assets/icon-180.png" alt="">
      <div><b>AAFL</b><span>AN AASN POOL</span></div>
    </a>
    <nav class="tabs" aria-label="AAFL">
      <a href="./">Home</a>
      <a href="picks.html">Picks</a>
      <a href="standings.html">Standings</a>
      <a href="results.html">Results</a>
      <a href="rules.html">Rules</a>
      <a href="whatsnew.html" aria-current="page">What's New</a>
      <a href="admin.html" class="nav-admin" hidden>⚙️ Admin</a>
    </nav>
    <button type="button" class="signin">SIGN IN</button>
  </div>
</header>

<main class="wrap pg">
  <h1>WHAT'S NEW</h1>
  <p class="lead">Every update to the AAFL, newest first.</p>
  <div class="log" id="log"><p class="lead">Loading…</p></div>
</main>

<footer class="wrap ftr">
  <span>© ANGRY ALPACA SPORTS NETWORK</span>
  <span>AAFL · <a href="../">AASN HOME</a></span>
</footer>

<script src="../shared/config.js"></script>
<script src="../shared/version.js?v=4" defer></script>
<script src="../shared/halloween.js?v=3" defer></script>
<script src="nav.js?v=1" defer></script>
<script src="../shared/auth.js?v=3"></script>
<script>
(function () {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  fetch('whatsnew.json?v=' + Date.now()).then(r => r.json()).then(list => {
    document.getElementById('log').innerHTML = list.map(x => `<article><h2>${esc(x.title)}</h2><time>${fmt(x.date)}</time><ul>${x.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></article>`).join('');
  }).catch(() => { document.getElementById('log').innerHTML = '<p class="lead">Updates unavailable right now.</p>'; });
})();
</script>
</body>
</html>
