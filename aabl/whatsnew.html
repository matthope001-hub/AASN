<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../shared/gate.js" data-gate="aabl"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New — AABL 2027</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C2340">
<link rel="icon" type="image/png" href="assets/aabl-badge.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.log { max-width: 820px; }
.entry { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--red); padding: 14px 18px; margin-bottom: 12px; }
.entry time { font-family: var(--mono); font-size: 12px; color: var(--red-text); }
.entry h2 { font-family: var(--display); font-weight: 400; font-size: 21px; margin: 4px 0 8px; }
.entry ul { padding-left: 20px; }
.entry li { font-size: 17px; line-height: 1.45; margin: 3px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap hdr">
    <a href="./" class="brand"><img src="assets/aabl-badge.png" alt="">AABL <span>20<em>/</em>27</span></a>
    <nav id="aabl-nav" aria-label="AABL" data-active="whatsnew"></nav>
    <button type="button" class="signin">SIGN IN</button>
  </div>
</header>

<main class="wrap log">
  <h1 class="title">WHAT'S NEW</h1>
  <div id="log"><p class="status">Loading…</p></div>
</main>

<footer><a href="../">AABL 2027 · AN AASN LEAGUE</a></footer>

<script>
(async function () {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const el = document.getElementById('log');
  try {
    const list = await (await fetch('whatsnew.json', { cache: 'no-cache' })).json();
    el.innerHTML = list.map(e => `<article class="entry"><time datetime="${esc(e.date)}">${new Date(e.date + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' }).toUpperCase()}</time>
      <h2>${esc(e.title)}</h2><ul>${e.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></article>`).join('');
    try { localStorage.setItem('aabl_whatsnew_seen', String(list.length)); } catch (er) { /* ignore */ }
  } catch (e) {
    el.innerHTML = '<p class="status">What\'s New is unavailable right now.</p>';
  }
})();
</script>
<script src="../shared/config.js"></script>
<script src="../shared/auth.js"></script>
<script src="nav.js"></script>
</body>
</html>
