name: AABL cut-out headshots

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Redo players that already have a cut-out (1 = yes)'
        required: false
  schedule:
    # Mondays ~5am Eastern: picks up any players added to the boxes
    - cron: '23 9 * * 1'

permissions:
  contents: write

concurrency:
  group: aabl-cutouts
  cancel-in-progress: false

jobs:
  cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install background remover
        run: pip install "rembg[cpu]==2.0.*" pillow
      - name: Make cut-outs
        env:
          SUPABASE_URL: https://tetgrmgurobacdohhiby.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ inputs.force }}
        run: python scripts/cutouts.py
      - name: Commit new cut-outs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aabl/headshots
          if git diff --cached --quiet; then echo "No new cut-outs"; exit 0; fi
          git commit -m "AABL: update cut-out headshots"
          git pull --rebase origin main
          git push origin HEAD:main
