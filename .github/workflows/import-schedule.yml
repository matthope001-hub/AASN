name: Import MLB schedule

on:
  schedule:
    # Daily ~6:05am Eastern: keeps the schedule current and sets the pick
    # deadline once MLB posts the Opening Day first-pitch time.
    - cron: '5 10 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'MLB season to import'
        required: true
        default: '2027'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Import schedule into Supabase
        env:
          SUPABASE_URL: https://tetgrmgurobacdohhiby.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEASON: ${{ inputs.season }}
        run: node scripts/import-schedule.mjs
