name: AAFL outbox

# Sends invite emails queued from the AAFL Admin page ("Send email"), from Matt's Gmail.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: aafl-outbox
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install mail library
        run: npm install --no-save nodemailer@6.9.16
      - name: Send queued invites
        env:
          SUPABASE_URL: https://tetgrmgurobacdohhiby.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/aafl-outbox.mjs
